<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Test — Brawlhalla</title>
<style>
:root{ --bg:#0b0f15; --panel:#121823; --panel2:#171f2c; --line:#243042; --text:#e6edf6; --muted:#8b9ab0; --accent:#4ea8ff;
  --ok:#3ecf8e; --warn:#ffb020; --err:#ff5c7a; --stage-bg:#0d1320; color-scheme: dark; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0}
header h1 span{color:var(--accent)}
header p{margin:0;color:var(--muted);font-size:12.5px}
main{max-width:1280px;margin:0 auto;padding:16px 20px 40px}
#steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-bottom:14px}
body.playing #steps{opacity:.45;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card.step h2{font-size:14.5px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.card.step .n{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.card.step.done .n{background:var(--ok);color:#04121f;border-color:var(--ok)}
.card.step p{margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--accent);color:#04121f;border:0;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:auto;white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#1f5a43}.pill.busy{color:var(--warn);border-color:#5a4a1f}.pill.err{color:var(--err);border-color:#5a1f2c}
.st{font-size:12.5px;color:var(--muted)}.st.ok{color:var(--ok)}.st.err{color:var(--err)}.st.busy{color:var(--warn)}
.muted{color:var(--muted);font-size:12.5px}.small{font-size:12px}
.empty{color:var(--muted);text-align:center;padding:50px 20px}
.adapt{margin-top:10px;padding:8px 10px;border:1px solid #5a4a1f;border-radius:8px;background:rgba(255,176,32,.06)}.adapt p{margin:0 0 8px}
.binds{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 12px;margin-top:6px}
.bind{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.bind > span:first-child{min-width:44px}
button.kbd,span.kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:12px;cursor:pointer;min-width:26px}
span.kbd.static{cursor:default;color:var(--muted)}
button.kbd.empty{color:var(--muted)}button.kbd.wait{border-color:var(--warn);color:var(--warn)}button.kbd.add{color:var(--muted)}
kbd{display:inline-block;min-width:20px;text-align:center;padding:1px 4px;border:1px solid var(--line);border-radius:4px;font-size:11.5px;color:var(--muted);margin-right:2px;font-family:inherit}
kbd.on{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:700}
.keys.big kbd{min-width:26px;padding:3px 6px;font-size:13px}
.play canvas{width:100%;height:auto;border-radius:8px;display:block;background:var(--stage-bg)}
.gvwrap{position:relative;margin-top:10px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.controls select,.num{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.num{width:64px}
.togs{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.tog{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--accent)}
.hud{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.hudp{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.hudp b{min-width:120px}
.rtinfo{margin:10px 0 2px;font-size:13px}.rtinfo kbd{font-size:12px}
.rtlist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.rtchip{font-size:12px;padding:3px 8px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.rtchip.cur{border-color:#e6a01e;color:#ffd166}.rtchip.landed{border-color:#28aa64;color:#3ccf91}
.rtchip.missed{border-color:#7a5560;color:#e08a9a}.rtchip.skipped{opacity:.6}
.btn.toggle.on{background:#2b2210;border-color:#e6a01e;color:#ffd166}
</style>

</header>

      const T = L.track, left = run.items.filter((x) => !x.result).length, dodge = it.sit.kind === "dodge";
      const stopKey = S.inputKind === "gamepad" ? "View/Back" : "Esc";
      let sub = `round ${run.round} \xB7 situation ${run.i + 1}/${run.items.length} \xB7 ${left} still to do \xB7 ${stopKey} to stop`;
      if (L.phase === "opening") return ["Loading situation\u2026", sub];
      if (L.phase === "wait") return dodge ? [`Press any button to start \u2014 then dodge ${name(it.sit.att)}'s ${it.sit.move}`, sub + " \xB7 only Dodge + directions work"] : [`Press ${commandLabel(it.sit.cmd)} to start`, sub];
      if (L.phase === "control" || L.phase === "finishing") {
        if (dodge) return [L.pressed ? `Dodge pressed \u2014 ${L.k} / ${L.N}` : `DODGE IT \u2014 ${L.k} / ${L.N}`, sub];
        return [T && T.first ? `Hit! Now read them \u2014 ${L.k} / ${L.N}` : `GO \u2014 ${L.k} / ${L.N}`, sub];
      }
      const here = it.attempts ? ` \xB7 ${dodge ? "dodged" : "landed"} ${it.landed || 0} of ${it.attempts} here` : "";
      if (run.repeat) sub = `\u{1F501} repeating situation ${run.i + 1}/${run.items.length}${here} \xB7 ${stopKey} to stop`;
      if (L.phase === "done") return [dodge ? "\u2713 Dodged it!" : "\u2713 Landed it!", sub];
      if (L.phase === "missed") return [(dodge ? dodgeMissText(L) : "\u2717 Missed") + (run.repeat ? " \u2014 again" : " \u2014 it comes back next round"), sub];
      return ["", sub];
    }
    function next() {
      const L = live;
      if (!L || !run) return;
      let home = false;
      if (run.q >= run.queue.length) {
        run.queue = run.items.map((x, k) => x.result ? -1 : k).filter((k) => k >= 0);
        run.q = 0;
        if (!run.queue.length) {
          run.i = -1;
          renderList();
          finish();
          return;
        }
        for (const k of run.queue) {
          const x = run.items[k];
          x.start = x.sit.kind === "dodge" ? dodgeStart(x.sit) : x.sit.t;
        }
        run.queue.sort((a, b) => run.items[a].start - run.items[b].start);
        run.round++;
        home = true;
      }
      run.i = run.queue[run.q++];
      renderList();
      const it = run.items[run.i], sit = it.sit;
      info.innerHTML = "";
      if (sit.kind === "dodge") {
        L.set({ ent: me.id, N: Math.ceil((sit.until - it.start) / LIVE_FRAME) + 4, t0: it.start, players, start: { any: true }, goal: "dodge", dodge: sit, rec: R.inputs && R.inputs[me.id] || [] });
        info.append(
          h("b", {}, `Round ${run.round} \xB7 situation ${run.i + 1} of ${run.items.length}`),
          " \xB7 ",
          fmtTms(sit.press),
          " \xB7 dodge ",
          h("b", {}, `${name(sit.att)}'s ${sit.move}`),
          ` (starts ${Math.round((sit.hitT - it.start) / LIVE_FRAME)} frames before it hits; ${Math.round((sit.hitT - sit.press) / LIVE_FRAME)} frames after they press)`,
          it.misses ? ` \xB7 missed ${it.misses}\xD7` : "",
          " \xB7 only ",
          h("kbd", {}, "Dodge"),
          " + directions work"
        );
      } else {
        L.set({ ent: me.id, N: RT_FRAMES, t0: sit.t, players, start: { cmd: sit.cmd, req: RT_REQ, full: sit.full, label: commandLabel(sit.cmd) }, goal: "hit" });
        const vic = A.players.find((p) => p.id === sit.vic);
        info.append(
          h("b", {}, `Round ${run.round} \xB7 situation ${run.i + 1} of ${run.items.length}`),
          " \xB7 ",
          fmtTms(sit.t),
          " \xB7 originally ",
          h("b", {}, sit.move),
          " on ",
          vic ? vic.name : "?",
          sit.opening ? "" : " (during a string)",
          it.misses ? ` \xB7 missed ${it.misses}\xD7` : "",
          " \xB7 start with ",
          h("kbd", {}, commandLabel(sit.cmd))
        );
      }
      L.phase = "opening";
      L.dirty = true;
      setStatus(`Loading situation ${run.i + 1}\u2026`);
      const buf = S.replay.bytes.slice(0).buffer;
      W.live.w.postMessage({ type: "liveOpen", id: L.job.id, name: S.replay.name, bytes: buf, t: it.start - LIVE_FRAME, warm: run.round === 1 && run.q === 1 ? 2 : 0, home, all: !L.view }, [buf]);
    }
    function done(result) {
      const it = run && run.items[run.i];
      if (!it || run.pending) return;
      it.attempts = (it.attempts || 0) + 1;
      if (result === "landed") {
        it.landed = (it.landed || 0) + 1;
        if (!it.result) {
          it.result = "landed";
          it.tries = it.misses + 1;
        }
      } else it.misses++;
      run.pending = true;
      renderList();
      setTimeout(() => {
        if (!run) return;
        run.pending = false;
        if (run.repeat && live) {
          live.again();
          setStatus("");
        } else next();
      }, result === "landed" ? 1300 : 1200);
    }
    function setRepeat(on) {
      if (run) run.repeat = on;
      else pendingRepeat = on;
      repeatBtn.classList.toggle("on", on);
      repeatBtn.textContent = on ? "\u{1F501} Repeating \u2014 click to stop" : "\u{1F501} Repeat this one";
      if (live) live.dirty = true;
    }
    function skip() {
      const it = run && run.items[run.i];
      if (!it || run.pending) return;
      if (run.repeat) setRepeat(false);
      if (live) live.phase = "opening";
      if (!it.result) it.result = "skipped";
      next();
    }
    function summary() {
      const ok = run.items.filter((x) => x.result === "landed"), sk = run.items.filter((x) => x.result === "skipped").length, tries = ok.reduce((a, x) => a + x.tries, 0);
      const kinds = new Set(run.items.map((x) => x.sit.kind === "dodge" ? "dodge" : "hit")), verb = kinds.size > 1 ? "did" : kinds.has("dodge") ? "dodged" : "landed";
      return `${verb} ${ok.length} of ${run.items.length}` + (ok.length ? ` (${tries} tr${tries === 1 ? "y" : "ies"} for those, ${ok.filter((x) => x.tries === 1).length} first time)` : "") + (sk ? `, skipped ${sk}` : "") + ` \xB7 ${run.round} round${run.round === 1 ? "" : "s"}`;
    }
    function finish() {
      endLive();
      setButtons(false);
      hud.innerHTML = "";
      setStatus(`All done: ${summary()}. Press Start to go again.`);
    }
    function stop() {
      if (!run) return;
      renderList();
      endLive();
      setButtons(false);
      setStatus(`Stopped: ${summary()}. Press Start to go again.`);
    }
    function setButtons(on) {
      startBtn.disabled = on || !avail;
      skipBtn.disabled = !on;
      stopBtn.disabled = !on;
      count.disabled = on;
      pSel.disabled = on;
      mSel.disabled = on;
      document.body.classList.toggle("playing", on);
    }
    function renderList() {
      list.innerHTML = "";
      if (!run) return;
      list.append(...run.items.map((it, k) => {
        const d = it.sit.kind === "dodge", lbl = d ? `\u{1F6E1} ${fmtTms(it.sit.press)} ${it.sit.move}` : `${fmtTms(it.sit.t)} ${it.sit.move}`;
        return h(
          "span",
          { class: "rtchip " + (it.result || (k === run.i ? "cur" : it.misses ? "missed" : "")), title: d ? `dodge ${name(it.sit.att)}'s ${it.sit.move}` : `${fmtTms(it.sit.t)} \u2014 follow up your ${it.sit.move}` },
          `${k + 1}. ${lbl}`,
          it.result === "landed" ? ` \u2713${it.attempts > it.tries ? ` ${it.landed}/${it.attempts}` : it.tries > 1 ? " " + it.tries + " tries" : ""}` : it.result === "skipped" ? " \u23ED" : it.misses ? ` \u2717${it.misses > 1 ? " \xD7" + it.misses : ""}` : ""
        );
      }));
    }
    return card;
  }
  function endLive() {
    if (!live) return;
    const L = live;
    live = null;
    L.dispose();
    if (W.live) W.live.handlers.delete(L.job.id);
    updateEngine();
  }
  function render() {
    if (live) return;
    const steps = $("#steps");
    steps.innerHTML = "";
    const g = S.game, r = S.replay;
    steps.append(
      h(
        "div",
        { class: "card step" + (g ? " done" : "") },
        h("h2", {}, h("span", { class: "n" }, "1"), "Game folder"),
        h("p", { class: "muted small" }, "Your Brawlhalla install folder (the one with BrawlhallaAir.swf), e.g. C:\\Program Files (x86)\\Steam\\steamapps\\common\\Brawlhalla. Its version must match the replay."),
        h("div", { class: "row" }, h("button", { class: "btn", onclick: () => chooseGame() }, g ? "Change folder" : "Choose folder"), h("span", { id: "gameStatus", class: "st" + (g ? " ok" : "") }, g ? `Brawlhalla ${g.version} \xB7 ${g.dirName}` : "")),
        S.unknownBuild ? h(
          "div",
          { class: "adapt" },
          h("p", { class: "small" }, `Brawlhalla was updated and this page doesn't know version ${g ? g.version : ""} yet. It can adapt by itself if you have an older copy of Brawlhalla: choose the BrawlhallaAir.swf of that copy (a version this page knew, e.g. 11.00 or 11.01). It's done once and remembered.`),
          h("button", { class: "btn small", onclick: () => chooseRefSwf() }, "Choose an older BrawlhallaAir.swf\u2026")
        ) : null
      ),
      h(
        "div",
        { class: "card step" + (S.R ? " done" : "") },
        h("h2", {}, h("span", { class: "n" }, "2"), "Replay"),
        h("p", { class: "muted small" }, "A .replay file, usually in %USERPROFILE%\\BrawlhallaReplays. It is analyzed once to find the hits (cached for next time)."),
        h("div", { class: "row" }, h("button", { class: "btn", disabled: !g, onclick: () => chooseReplay() }, r ? "Change replay" : "Choose replay"), h("span", { id: "replayStatus", class: "st" }, ""))
      ),
      h("div", { class: "card step" }, h("h2", {}, h("span", { class: "n" }, "3"), "Controls"), controlsCard())
    );
    if (r && !g) setReplayStatus(`${r.name} \u2014 choose the game folder first`, "");
    else if (r) setReplayStatus(lastReplayStatus || r.name, lastReplayCls);
    const pl = $("#play");
    pl.innerHTML = "";
    if (g && S.R) pl.append(playCard());
    else pl.append(h("div", { class: "card empty" }, !g ? "Start with your Brawlhalla folder." : !r ? "Now choose a replay." : "Analyzing the replay\u2026"));
  }
  document.addEventListener("DOMContentLoaded", async () => {
    buildMaps = await DB.get("buildMaps") || {};
    S.binds = await DB.get("binds") || KB.DEFAULT;
    S.padMap = await DB.get("padMap") || PAD_DEFAULT;
    S.inputKind = await DB.get("inputKind") || "keyboard";
    S.me = await DB.get("me") || null;
    S.mode = await DB.get("rtMode") || "hits";
    render();
    setupLoop();
    updateEngine();
    const hnd = await DB.get("gameDir");
    if (hnd) {
      const b = h("button", { class: "btn small ghost", onclick: () => {
        b.remove();
        chooseGame(hnd);
      } }, `Use ${hnd.name} again`);
      const row = $("#steps .step .row");
      if (row) row.append(b);
    }
  });
})();
</script>
</body>
